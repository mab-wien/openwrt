# Fork-local CI. Not part of upstream OpenWrt.
#
# Builds a full sysupgrade image for the Zyxel XGS1210-12 from this branch
# (openwrt master + the rtl83xx/rtl930x tc-flower offload series + the
# rtl930x PIE fixes + the L4/VLAN template-verify fix), with the tcfilter
# and luci-app-tcfilter packages baked in, and publishes it plus the .apk
# files to a rolling pre-release tagged `xgs1210-12-tcflower`.
#
# The branch is a rebasing build vehicle, not a PR source. Refresh it with
#   git rebase upstream/master && git push -f
# which re-triggers this workflow.
#
# Beta: the offload series is still under upstream review (openwrt/openwrt
# #24994 / #25024). Keep console / recovery access.

name: Build tcflower image

on:
  push:
    branches: [realtek-rtl930x-tcflower-image]
  workflow_dispatch:

concurrency:
  group: build-tcflower-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath

      - uses: actions/checkout@v4
        with:
          ref: realtek-rtl930x-tcflower-image
          fetch-depth: 0

      - name: Vendor the tcfilter packages from package-tcfilter
        run: |
          git fetch origin package-tcfilter
          rm -rf package/network/config/tcfilter package/luci-app-tcfilter
          git checkout origin/package-tcfilter -- \
            package/network/config/tcfilter package/luci-app-tcfilter
          git log -1 --oneline origin/package-tcfilter

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure realtek/rtl930x - Zyxel XGS1210-12 B1
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl930x=y
          CONFIG_TARGET_realtek_rtl930x_DEVICE_zyxel_xgs1210-12-b1=y
          CONFIG_PACKAGE_tcfilter=y
          CONFIG_PACKAGE_luci-app-tcfilter=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E 'CONFIG_PACKAGE_(tcfilter|luci-app-tcfilter|tc-full)=|CONFIG_TARGET_ARCH_PACKAGES=' .config

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: |
          make -j$(nproc) world || {
            echo "::group::verbose single-threaded rebuild"
            make -j1 V=s world
            echo "::endgroup::"
            exit 1
          }

      - name: Collect artifacts
        id: collect
        run: |
          arch=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/\1/p' .config)
          img="bin/targets/realtek/rtl930x"
          pkg="bin/packages/${arch}/base"
          mkdir -p out
          cp "$img"/openwrt-realtek-rtl930x-zyxel_xgs1210-12-b1-squashfs-sysupgrade.bin out/
          cp "$img"/openwrt-realtek-rtl930x-zyxel_xgs1210-12-b1-initramfs-kernel.bin  out/ || true
          cp "$img"/*zyxel_xgs1210-12-b1*.manifest out/ || true
          cp "$img"/config.buildinfo out/ || true
          cp "$pkg"/tcfilter-*.apk "$pkg"/luci-app-tcfilter-*.apk "$pkg"/tc-full-*.apk out/
          ( cd out && sha256sum * | tee sha256sums )
          ls -lah out
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcflower-image-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Refresh the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: xgs1210-12-tcflower
        run: |
          built_sha=$(git rev-parse HEAD)
          pkg_sha=$(git rev-parse --short origin/package-tcfilter)
          base=$(git merge-base HEAD refs/remotes/origin/realtek-rtl930x-tcflower-image || true)
          git push -f origin "${built_sha}:refs/tags/${TAG}"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "XGS1210-12 - tc-flower offload build" \
            --prerelease \
            --notes "$(printf 'Beta image for the Zyxel XGS1210-12: openwrt master + the rtl83xx/rtl930x tc-flower offload series (openwrt/openwrt#24994), the rtl930x PIE fixes (#25024) and the L4/VLAN template-verify fix, with tcfilter + luci-app-tcfilter (package-tcfilter @ %s) baked in.\n\nStill under upstream review; keep console / recovery access.\n\nFlash: `sysupgrade -v <sysupgrade.bin>`.' "$pkg_sha")" \
            out/*
