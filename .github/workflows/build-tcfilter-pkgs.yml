# Fork-local CI. Not part of upstream OpenWrt.
#
# Builds the tcfilter + luci-app-tcfilter packages (and their tc-full
# dependency) for realtek/rtl930x and publishes the .apk files to a rolling
# pre-release tagged `tcfilter-pkgs-latest`. Both the versioned names and
# stable aliases (tc-full.apk / tcfilter.apk / luci-app-tcfilter.apk) are
# uploaded. OpenWrt's apk cannot install from a URL, so fetch first:
#
#   cd /tmp
#   for p in tc-full tcfilter luci-app-tcfilter; do
#     wget -O $p.apk https://github.com/mab-wien/openwrt/releases/download/tcfilter-pkgs-latest/$p.apk
#   done
#   apk add --allow-untrusted ./tc-full.apk ./tcfilter.apk ./luci-app-tcfilter.apk
#
# (--allow-untrusted because the fork signs with its own throwaway key.)

name: Build tcfilter packages

on:
  push:
    branches: [package-tcfilter]
    paths:
      - 'package/network/config/tcfilter/**'
      - 'package/luci-app-tcfilter/**'
      - '.github/workflows/build-tcfilter-pkgs.yml'
  workflow_dispatch:

concurrency:
  group: build-tcfilter-pkgs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath

      - uses: actions/checkout@v4

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure realtek/rtl930x - Zyxel XGS1210-12 B1
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl930x=y
          CONFIG_TARGET_realtek_rtl930x_DEVICE_zyxel_xgs1210-12-b1=y
          CONFIG_PACKAGE_tcfilter=y
          CONFIG_PACKAGE_luci-app-tcfilter=y
          EOF
          make defconfig
          grep -E 'CONFIG_PACKAGE_(tcfilter|luci-app-tcfilter|tc-full)=|CONFIG_TARGET_ARCH_PACKAGES=' .config

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: |
          make -j$(nproc) world || {
            echo "::group::verbose single-threaded rebuild"
            make -j1 V=s world
            echo "::endgroup::"
            exit 1
          }

      - name: Collect artifacts
        id: collect
        run: |
          arch=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/\1/p' .config)
          src="bin/packages/${arch}/base"
          mkdir -p out
          cp "$src"/tcfilter-*.apk "$src"/luci-app-tcfilter-*.apk "$src"/tc-full-*.apk out/
          # stable aliases so the install instructions don't need the version
          ( cd out
            cp tcfilter-*.apk          tcfilter.apk
            cp luci-app-tcfilter-*.apk luci-app-tcfilter.apk
            cp tc-full-*.apk           tc-full.apk )
          ( cd out && sha256sum *.apk | tee sha256sums )
          ls -lah out
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcfilter-packages-${{ steps.collect.outputs.arch }}-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Refresh the "latest" package release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tcfilter-pkgs-latest
        run: |
          built_sha=$(git rev-parse HEAD)
          git push -f origin "${built_sha}:refs/tags/${TAG}"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "tcfilter packages - latest" \
            --notes "$(printf 'Automated build of `package-tcfilter` @ %s (run %s) for realtek/rtl930x (%s).\n\nInstall on the switch:\n\n```\ncd /tmp\nfor p in tc-full tcfilter luci-app-tcfilter; do\n  wget -O $p.apk https://github.com/%s/releases/download/%s/$p.apk\ndone\napk add --allow-untrusted ./tc-full.apk ./tcfilter.apk ./luci-app-tcfilter.apk\n```' "$built_sha" "$GITHUB_RUN_ID" "${{ steps.collect.outputs.arch }}" "$GITHUB_REPOSITORY" "$TAG")" \
            --prerelease \
            out/*
