# Fork-local CI. Not part of upstream OpenWrt.
#
# On a schedule (and on demand) the patch stack on `main` is rebased onto the
# current openwrt/openwrt main; if that is conflict-free the result is pushed.
# Then the Zyxel XGS1210-12 (rev B1) image is built and uploaded as an artifact.
# A push to `main` skips the rebase and just builds what was pushed.
#
# The freshest build is also published to a rolling pre-release tagged
# `xgs1210-12-latest`, so the current `main` image is always downloadable
# without a GitHub login: https://github.com/mab-wien/openwrt/releases/tag/xgs1210-12-latest
name: Build Zyxel XGS1210-12

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: build-xgs1210-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build: ${{ steps.s.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase patch stack onto current openwrt/openwrt main
        id: s
        run: |
          echo "build=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push event - building as pushed, no rebase"
            exit 0
          fi
          git config user.name "Mark Abe"
          git config user.email "github@mab.wien"
          git remote add upstream https://github.com/openwrt/openwrt.git 2>/dev/null || true
          git fetch --no-tags upstream main
          base=$(git merge-base HEAD upstream/main)
          up=$(git rev-parse upstream/main)
          if [ "$base" = "$up" ]; then
            echo "main already sits on the latest upstream - nothing to rebuild"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rebase --onto "$up" "$base"; then
            git push --force-with-lease origin HEAD:main
            echo "rebased $(git rev-list --count "$up"..HEAD) commit(s) onto $(git rev-parse --short "$up") and pushed main"
          else
            git rebase --abort || true
            echo "::error::rebase onto openwrt/openwrt main hit conflicts - main was NOT updated, fix it manually"
            exit 1
          fi

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure realtek/rtl930x - Zyxel XGS1210-12 B1
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl930x=y
          CONFIG_TARGET_realtek_rtl930x_DEVICE_zyxel_xgs1210-12-b1=y
          EOF
          make defconfig
          ./scripts/diffconfig.sh

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: |
          make -j$(nproc) world || {
            echo "::group::verbose single-threaded rebuild"
            make -j1 V=s world
            echo "::endgroup::"
            exit 1
          }

      - name: List build output
        run: |
          df -h /
          ls -lah bin/targets/realtek/rtl930x/ || true

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-zyxel-xgs1210-12-b1-${{ github.sha }}
          path: |
            bin/targets/realtek/rtl930x/*zyxel_xgs1210-12-b1*
            bin/targets/realtek/rtl930x/sha256sums
            bin/targets/realtek/rtl930x/config.buildinfo
          if-no-files-found: error
          retention-days: 30

      # Publish the same files to a rolling pre-release so the current `main`
      # image is downloadable without a login. The tag is force-moved onto the
      # built commit every run and the release is recreated, dropping stale
      # assets. Moving the tag with git first keeps this race-free.
      - name: Refresh the "latest main" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: xgs1210-12-latest
        run: |
          # The scheduled run is triggered by the pre-rebase commit, so take the
          # SHA that was actually checked out and built, not $GITHUB_SHA.
          built_sha=$(git rev-parse HEAD)
          git push -f origin "${built_sha}:refs/tags/${TAG}"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes || true
          cd bin/targets/realtek/rtl930x
          shopt -s nullglob
          assets=(sha256sums config.buildinfo *zyxel_xgs1210-12-b1*)
          [ "${#assets[@]}" -ge 3 ] || { echo "::error::no image assets found"; exit 1; }
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Zyxel XGS1210-12 B1 - latest main" \
            --notes "Automated build of \`main\` @ ${built_sha} (run ${GITHUB_RUN_ID}), patch stack rebased onto openwrt/openwrt main." \
            --prerelease \
            "${assets[@]}"
